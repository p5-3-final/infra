name: agent-config-sync

# .claude/(rules, skills) 원본과 .agents/ 생성본이 일치하는지 검사한다.
on:
  pull_request:
    paths:
      - ".claude/rules/**"
      - ".claude/skills/**"
      - ".agents/**"
      - "scripts/sync-agent-config.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./scripts/sync-agent-config.sh --check
